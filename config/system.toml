# ============================================================
# 大模型代码检查测评系统 · 全局配置
# 评分权重改完重跑 score；执行参数改完重跑 execute，均不需要重新采集
# ============================================================

[system]
version = "0.3.0"
prompt_version = "review_v2"
scoring_version = "score_v1"


# ---------- 采集限制 ----------
[limits]
# 单次作答最多允许报几条。这是压制"凑数"的第一道闸，比限制字数有效
max_findings_per_task = 12
# 单题最长耗时（秒）。超过即视为超时，仍计入但打标
max_task_seconds = 7200
# 每个字段的字符上限，超限即判该条不合规并要求重跑
[limits.chars]
title = 40
trigger = 120
impact = 120
verify_hint = 80


# ---------- 计分权重 ----------
# 这三个数是价值判断，不是客观真理。可自行调整后重跑 score
[weights]
# 每条误报扣分。小于 1 是刻意的：漏掉真 bug 的代价高于多看一个假
false_positive_penalty = 0.5
# 独到命中（只有一家提出且被判为真）的加成倍数
unique_bonus = 2.0
# 少于这个条数时，缺额按误报计。防止模型学会"沉默"这个最优策略
min_findings = 3

[weights.severity]
P0 = 5.0
P1 = 3.0
P2 = 2.0
P3 = 1.0


# ---------- 时间与成本 ----------
# 时间只做轻微惩罚，主分仍是正确率
[time_penalty]
enabled = true
# 超过所有候选该题中位耗时的多少倍开始扣分
grace_ratio = 2.0
# 封顶扣分比例（0.05 = 最多扣 5%）
max_penalty = 0.05


# ---------- 可执行裁决 ----------
# 执行的是模型生成代码，独立目录不等于安全沙箱；执行前必须审查并显式授权
[execution]
timeout_seconds = 15
max_test_chars = 12000


# ---------- 交叉验证 ----------
[judge]
# 一条发现被"不同厂商"的几家提出才算共识（按厂商去重，不按模型数）
# 用比例而非绝对数：support_ratio >= consensus_ratio 即视为共识
consensus_ratio = 0.5
# 单条 claim 的裁判票数
panel_size = 3
# 共识以下的条目，只有这些严重度才进人工队列
human_queue_severities = ["P0", "P1"]
# 裁判看到的代码上下文：claim 行号上下各取多少行
context_lines = 60


# ---------- 聚类 ----------
[clustering]
# 同一文件内，行号差在这个范围内视为同一处问题
line_window = 8
# 行号差超过这个值时，额外要求问题里的函数名（snake_case 标识符）有交集，
# 否则不合并。目的：避免把相邻两行的两个不同 bug 合成一处
hard_line_window = 3
